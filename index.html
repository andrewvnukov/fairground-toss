<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ярмарочный Тир</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">

<style>
  :root{
    /* ── Токены под тему «вечерняя ярмарка, тир с рогаткой» ── */
    --ink:#3E2245; --ink-soft:#9B7FA0; --line:#4B2A52;
    --paper:#FFF6E8;
    --accent:#FF6F4A; --accent-deep:#D6502F;
    --gold:#FFC94A; --mint:#6FCF97; --lav:#B497D6;
    --bg:#2C1A3B;
    --ok:#6FCF97; --ok-deep:#3E8A6C; --rowbg:#FFF1DC;
  }
  [hidden]{display:none!important}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  html,body{height:100%;overflow:hidden}
  body{font-family:'Nunito',system-ui,sans-serif;color:var(--ink);position:fixed;inset:0;background:var(--bg)}
  #cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
  #hud{position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column;
       padding:calc(10px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom));
       max-width:560px;margin:0 auto}
  .top{display:flex;gap:8px;align-items:flex-start}
  .chip{background:var(--paper);border:2.5px solid var(--line);border-radius:16px;padding:6px 12px 6px 8px;
        display:flex;gap:8px;align-items:center;box-shadow:0 3px 0 rgba(62,34,69,.28)}
  .chip .ic{width:26px;height:26px;flex:none}
  .chip .tx{display:flex;flex-direction:column;gap:1px}
  .chip .v{font-weight:900;font-size:17px;line-height:1}
  .chip .l{font-size:10px;font-weight:800;color:var(--ink-soft);letter-spacing:.3px}
  .spacer{flex:1}
  #side{position:absolute;right:max(12px,calc(50% - 268px));top:118px;display:flex;flex-direction:column;gap:12px;pointer-events:auto}
  .rbtn{width:52px;height:52px;border-radius:50%;background:var(--paper);border:2.5px solid var(--line);
        box-shadow:0 3px 0 rgba(62,34,69,.28);display:flex;align-items:center;justify-content:center;
        cursor:pointer;transition:transform .08s,box-shadow .08s;padding:0}
  .rbtn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(62,34,69,.28)}
  .rbtn svg{width:27px;height:27px;display:block}
  .rbtn .langTxt{font-weight:900;font-size:13px;color:var(--ink);letter-spacing:.2px}
  /* призы — сведённая в один пункт витрина (было 2 отдельные кнопки: магазин + полка), поэтому
     крупнее и весомее соседей — единственный "хаб" бокового ряда, а не рядовая иконка */
  .rbtn.primary{width:62px;height:62px;background:linear-gradient(180deg,#FFFDF5,var(--paper))}
  .rbtn.primary svg{width:33px;height:33px}
  .bottom{display:flex;gap:10px;pointer-events:auto;align-items:stretch}
  .abtn{background:var(--paper);border:2.5px solid var(--line);border-radius:16px;padding:10px 8px;
        font-weight:900;font-size:15px;cursor:pointer;box-shadow:0 3px 0 rgba(62,34,69,.28);
        transition:transform .08s,box-shadow .08s;display:flex;flex-direction:column;align-items:center;gap:2px;color:#fff}
  .abtn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(62,34,69,.28)}
  .abtn .bt{font-size:15px;line-height:1.05}
  .abtn .bs{font-size:11px;font-weight:800;opacity:.92;display:flex;align-items:center;gap:3px}
  .abtn .bs svg{width:12px;height:12px}
  /* подарок — широкая главная кнопка (текст+сумма в ряд) */
  .abtn.main{flex:1;background:var(--accent);border-color:var(--accent-deep)}
  /* ×2 — компактная квадратная кнопка-бустер рядом, не клон подарка по форме/весу:
     иконка сверху, крупный "×2" и мелкий таймер под ним, фиксированная узкая ширина */
  .abtn.x2{flex:0 0 76px;background:var(--lav);border-color:#8767AD;justify-content:center;padding:8px 4px}
  .abtn.x2 .x2ic{width:20px;height:20px}
  .abtn.x2 .x2main{font-size:16px;line-height:1.05}
  .abtn.x2 .x2sub{font-size:10px;font-weight:800;opacity:.9}
  .abtn.off{filter:grayscale(.55) brightness(.92)}
  /* ── модалка (призы/улучшения/полка) ── */
  #modal{position:absolute;inset:0;background:rgba(20,10,28,.6);display:flex;align-items:flex-end;
         justify-content:center;pointer-events:auto;z-index:9;transition:opacity .2s}
  #modal.hidden{opacity:0;pointer-events:none}
  .sheet{position:relative;background:linear-gradient(180deg,#FFFDF5,#FBEED2);width:100%;max-width:560px;
         border:3px solid var(--line);border-bottom:none;border-radius:24px 24px 0 0;
         padding:16px 14px calc(16px + env(safe-area-inset-bottom));max-height:85%;
         display:flex;flex-direction:column;box-shadow:0 -6px 24px rgba(20,10,28,.35)}
  #mScroll{overflow-y:auto;overflow-x:hidden}
  #mTitle{font-weight:900;font-size:20px;text-align:center;margin:2px 44px 12px;color:var(--ink)}
  #mClose{position:absolute;top:10px;right:12px;width:38px;height:38px;border-radius:50%;z-index:2;
          background:var(--paper);border:2.5px solid var(--line);font-size:21px;font-weight:900;
          color:var(--ink);cursor:pointer;box-shadow:0 3px 0 rgba(62,34,69,.28)}
  #mClose:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(62,34,69,.28)}
  /* сегмент-переключатель "Купить/Полка" внутри объединённой модалки призов */
  .tabs{display:flex;gap:8px;margin:0 0 12px}
  .tabBtn{flex:1;background:#FFF8E6;border:2.5px solid var(--line);border-radius:12px;padding:8px;
          font-weight:900;font-size:13px;color:var(--ink-soft);cursor:pointer;box-shadow:0 2px 0 rgba(62,34,69,.18)}
  .tabBtn.active{background:var(--accent);color:#fff;border-color:var(--accent-deep)}
  .row{display:flex;align-items:center;gap:10px;background:#FFF8E6;border:2.5px solid var(--line);
       border-radius:16px;padding:9px 10px;margin-bottom:9px;box-shadow:0 2px 0 rgba(62,34,69,.18)}
  .row .thumb{width:52px;height:44px;flex:none;background:#F1E3C6;border:2px solid var(--line);border-radius:11px}
  .row .info{flex:1;min-width:0}
  .row .nm{font-weight:900;font-size:15px;line-height:1.1}
  .row .ds{font-size:11.5px;font-weight:800;color:var(--ink-soft);margin-top:1px}
  .buy{border:2.5px solid var(--accent-deep);background:var(--accent);color:#fff;font-weight:900;
       font-size:13px;padding:8px 12px;border-radius:12px;cursor:pointer;white-space:nowrap;
       box-shadow:0 2px 0 rgba(62,34,69,.25);flex:none}
  .buy:active{transform:translateY(1px)}
  .buy.can-not{background:#CFC7B4;border-color:#B3AB98;color:#7C7462}
  .buy.owned{background:var(--mint);border-color:#5FA045}
  .buy.maxed{background:var(--lav);border-color:#8767AD}
  .coll{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
  .card{background:#FFF8E6;border:2.5px solid var(--line);border-radius:14px;padding:8px 4px 6px;
        text-align:center;box-shadow:0 2px 0 rgba(62,34,69,.18)}
  .card canvas{width:78px;height:56px;display:block;margin:0 auto}
  .card .cn{font-weight:900;font-size:12px;margin-top:3px}
  .card.locked{opacity:.72}
  .card .qm{font-weight:900;font-size:30px;color:var(--ink-soft);height:56px;line-height:56px}
  /* ── средний горизонт: полоска остановки под шапкой ── */
  .routebar{width:100%;max-width:340px;margin-top:8px;background:var(--paper);border:2.5px solid var(--line);
        border-radius:16px;padding:7px 10px;box-shadow:0 3px 0 rgba(0,0,0,.22);pointer-events:auto;
        cursor:pointer;display:flex;flex-direction:column;gap:4px;text-align:left;font-family:inherit;color:var(--ink)}
  .routebar:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.22)}
  .rb-head{display:flex;align-items:center;gap:7px;font-weight:900;font-size:12.5px;line-height:1.1}
  .rb-head .dots{display:flex;gap:3px;flex:none}
  .rb-head .dots i{width:8px;height:8px;border-radius:50%;background:rgba(0,0,0,.18);border:1.5px solid var(--line);display:block}
  .rb-head .dots i.on{background:var(--ok)}
  .rb-head .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rb-goal{display:flex;gap:6px;align-items:baseline;font-size:11.5px;font-weight:800;color:var(--ink-soft)}
  .rb-goal .gp{margin-left:auto;font-weight:900;color:var(--ink);flex:none}
  .rb-goal.ready{color:var(--ok-deep)}
  .top{flex-wrap:wrap}
  .chip{min-width:0}
  @media (max-width:370px){
    .chip{padding:5px 8px 5px 6px;gap:5px}
    .chip .ic{width:20px;height:20px}
    .chip .v{font-size:14px}
    .chip .l{font-size:8.5px;letter-spacing:0}
  }
  /* ── карта маршрута ── */
  .stop{display:flex;gap:10px;align-items:flex-start;background:var(--rowbg);border:2.5px solid var(--line);
        border-radius:16px;padding:9px 10px;margin-bottom:8px;box-shadow:0 2px 0 rgba(0,0,0,.15)}
  .stop.cur{border-color:var(--accent-deep)}
  .stop.done{opacity:.86}
  .stop.fog{opacity:.6}
  .stop .num{width:30px;height:30px;flex:none;border-radius:50%;background:var(--paper);border:2.5px solid var(--line);
        font-weight:900;font-size:13px;display:flex;align-items:center;justify-content:center}
  .stop.done .num{background:var(--ok);color:#fff}
  .stop.cur .num{background:var(--accent);color:#fff}
  .stop .sb{flex:1;min-width:0}
  .stop .sn{font-weight:900;font-size:15px}
  .stop .sw{font-size:11.5px;font-weight:800;color:var(--ink-soft);margin-top:2px}
  .glist{margin-top:7px;display:flex;flex-direction:column;gap:5px}
  .gitem{display:flex;gap:7px;align-items:center;font-size:12px;font-weight:800;background:var(--paper);
        border:2px solid var(--line);border-radius:11px;padding:5px 8px}
  .gitem .gm{width:15px;height:15px;flex:none;border-radius:50%;border:2px solid var(--line);background:rgba(0,0,0,.14)}
  .gitem.ok .gm{background:var(--ok)}
  .gitem .gt{flex:1;min-width:0}
  .gitem .gv{font-weight:900;flex:none}
  .wide{width:100%;border:2.5px solid var(--accent-deep);background:var(--accent);color:#fff;font-weight:900;
        font-size:15px;padding:11px;border-radius:14px;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.2);
        margin-top:4px;font-family:inherit}
  .wide:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.2)}
  .wide.okb{background:var(--ok);border-color:var(--ok-deep)}
  .wide.ghost{background:rgba(0,0,0,.07);border-color:var(--ink-soft);color:var(--ink-soft)}
  .note{font-size:12px;font-weight:800;color:var(--ink-soft);text-align:center;margin:8px 2px 2px;line-height:1.35}
  .offline{display:flex;align-items:center;gap:9px;font-size:13.5px;font-weight:800;background:var(--rowbg);
        border:2.5px solid var(--line);border-radius:14px;padding:8px 10px;margin-bottom:7px}
  .offline .ov{margin-left:auto;font-weight:900}
  .dayrow{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:10px}
  .dayc{border:2.5px solid var(--line);border-radius:11px;background:var(--rowbg);padding:6px 2px;text-align:center;
        font-weight:900;font-size:10.5px;box-shadow:0 2px 0 rgba(0,0,0,.13)}
  .dayc.past{background:var(--ok);color:#fff}
  .dayc.cur{background:var(--gold);border-color:var(--accent-deep)}
  .dayc .dv{display:block;font-size:9px;font-weight:800;opacity:.9;margin-top:2px}
  /* ── контекстная подсказка ── */
  .bubble{position:fixed;width:230px;z-index:20;background:var(--ink);color:#fff;font-weight:800;font-size:12.5px;
        line-height:1.3;padding:9px 11px;border-radius:13px;box-shadow:0 4px 14px rgba(0,0,0,.4);
        transform:translate(-50%,-100%);pointer-events:none}
  .bubble.side{transform:translate(-100%,-50%)}
  .tipTarget{position:relative;z-index:16;outline:3px solid var(--gold);outline-offset:2px;border-radius:14px;
        animation:tipPulse 1.2s ease-in-out infinite}
  @keyframes tipPulse{0%,100%{outline-color:var(--gold)}50%{outline-color:rgba(240,193,78,.35)}}
  #toast{position:absolute;left:50%;bottom:104px;transform:translateX(-50%) translateY(20px);
         background:var(--ink);color:#fff;font-weight:800;font-size:14px;padding:9px 16px;border-radius:99px;
         opacity:0;transition:.25s;pointer-events:none;z-index:8;text-align:center;max-width:82%}
  #toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>

<script>
'use strict';
// ============================================================
//  Ярмарочный Тир / Fairground Toss — прицельный бросок мешочка рогаткой
//  по пирамиде банок (впервые в конвейере): тяни назад от рогатки и
//  отпускай, мешочек летит по параболе, попадание валит банки цепочкой
//  (сбитая опора роняет то, что на ней держалось) — целься в нижний
//  центр пирамиды ради максимального джекпота.
// ============================================================
const SAVE_KEY = "fairground_toss_v1";
const LB_NAME  = "cascade";
let ysdk=null, player=null, lb=null, saveT=0, booted=false;

// ---------- i18n ----------
// платформенный язык читаем один раз, как только SDK готов, НЕЗАВИСИМО от того,
// есть ли уже сохранённый явный выбор игрока — иначе при сохранённом S.lang
// свойство ysdk.environment.i18n.lang вообще не будет затронуто ни разу за
// сессию, и дебаг-панель площадки покажет "I18N is not used".
let platformLang=null;
function readPlatformLang(){
  try{ if(ysdk&&ysdk.environment&&ysdk.environment.i18n&&ysdk.environment.i18n.lang){
    platformLang = ysdk.environment.i18n.lang==="ru"?"ru":"en"; return; } }catch(e){}
  platformLang = (navigator.language||"ru").slice(0,2)==="ru"?"ru":"en";
}
function lang(){
  try{ if(S && (S.lang==="ru"||S.lang==="en")) return S.lang; }catch(e){}
  if(platformLang===null) readPlatformLang();
  return platformLang;
}
function toggleLang(){
  S.lang = lang()==="ru" ? "en" : "ru";
  document.documentElement.setAttribute("lang", S.lang);
  refreshHud(); persist(true); sfx("tap");
}
const STR = {
  coins:{ru:"ЖЕТОНЫ",en:"TOKENS"}, streak:{ru:"СЕРИЯ",en:"STREAK"},
  gift:{ru:"Подарок",en:"Gift"},
  x2:{ru:"×2",en:"×2"}, x2on:{ru:"×2 уже идёт",en:"×2 already active"},
  need:{ru:"Не хватает жетонов",en:"Not enough tokens"},
  shopTitle:{ru:"Купить призы",en:"Buy prizes"},
  upTitle:{ru:"Улучшения",en:"Upgrades"},
  shelfTitle:{ru:"Полка призов",en:"Prize shelf"},
  tabBuy:{ru:"Купить",en:"Buy"}, tabShelf:{ru:"Полка",en:"Shelf"},
  buy:{ru:"Купить",en:"Buy"}, owned:{ru:"На полке",en:"On shelf"},
  lvl:{ru:"Ур.",en:"Lv."}, maxLvl:{ru:"Макс.",en:"Max"},
  upAim:{ru:"Меткий глаз",en:"Sharp eye"}, upAimD:{ru:"Шире зона попадания по банкам",en:"Wider hit zone on cans"},
  upLights:{ru:"Гирлянды",en:"Festive lights"}, upLightsD:{ru:"+25% к пассивному доходу",en:"+25% passive income"},
  upHost:{ru:"Щедрый хозяин",en:"Generous host"}, upHostD:{ru:"−5% к цене приза",en:"−5% prize cost"},
  daily:{ru:"Ежедневный подарок:",en:"Daily gift:"},
  x2got:{ru:"Жетоны удвоены на 5 минут!",en:"Tokens doubled for 5 minutes!"},
  giftGot:{ru:"Подарок:",en:"Gift:"},
  newPrize:{ru:"Новый приз:",en:"New prize:"},
  allPrizes:{ru:"Все призы на полке!",en:"All prizes on the shelf!"},
  hintAim:{ru:"Потяни рогатку назад и отпусти, чтобы бросить мешочек",en:"Pull the slingshot back and let go to toss the bag"},
  jackpot:{ru:"Джекпот!",en:"Jackpot!"},
  perSec:{ru:"/с",en:"/s"},
  ipsUnit:{ru:"жетонов/с",en:"tokens/s"},

  // ── маршрут (дальний горизонт) ──

const ROUTE = [
  { id:'s0', twist:'w0', maxItems:3, pal:{bg:'#2C1A3B', sky1:'#5B3A6B', sky2:'#2C1A3B', warm:'#FFC94A'} },
  { id:'s1', twist:'w1', maxItems:4, pal:{bg:'#3A2340', sky1:'#7A4A78', sky2:'#3A2340', warm:'#FFD97A'} },
  { id:'s2', twist:'w2', maxItems:5, pal:{bg:'#1E2C42', sky1:'#3E5A80', sky2:'#1E2C42', warm:'#8FD6F0'} },
  { id:'s3', twist:'w3', maxItems:7, pal:{bg:'#191426', sky1:'#33294F', sky2:'#191426', warm:'#C9A0F0'} },
  { id:'s4', twist:'w4', maxItems:8, pal:{bg:'#3E1A2E', sky1:'#7A2F54', sky2:'#3E1A2E', warm:'#FF9AC0'} },
  { id:'s5', twist:'w5', maxItems:9, pal:{bg:'#3A2A14', sky1:'#7A5A24', sky2:'#3A2A14', warm:'#FFE08A'} },
];
const ROUTE_N = ROUTE.length;
// Во столько примерно вырастает доход за круг: всё, что измеряется в жетонах,
// на следующем круге считается от темпа игрока, а не абсолютными числами.
const LOOP_SCALE = 1000;
const MAX_LOOP = 20;              // за этим пределом Math.pow уходит в Infinity
const loopScale = () => Math.pow(LOOP_SCALE, Math.min(MAX_LOOP, S.loop||0));

// Чек-лист места — ровно три пункта РАЗНОГО типа (собрать / достичь / сделать).
const GOALS = [
  [ {t:'collect',n:3}, {t:'income',n:6.0e3}, {t:'cascade',n:4} ],
  [ {t:'collect',n:4}, {t:'income',n:2.5e4}, {t:'throws',n:120} ],
  [ {t:'collect',n:5}, {t:'income',n:8.0e4}, {t:'jackpots',n:15} ],
  [ {t:'collect',n:7}, {t:'income',n:7.0e5}, {t:'shelfOne',n:1} ],
  [ {t:'collect',n:8}, {t:'income',n:1.8e6}, {t:'throws',n:500} ],
  [ {t:'collect',n:9}, {t:'income',n:6.0e6}, {t:'seeds',n:6} ],
];
const stop      = () => ROUTE[Math.min(ROUTE_N-1, Math.max(0, S.route|0))];
const stopIdx   = () => Math.min(ROUTE_N-1, Math.max(0, S.route|0));
// Твист включён навсегда, как только игрок до него доехал, и второй круг
// НИЧЕГО не отнимает: пройденный маршрут оставляет все правила открытыми.
const hasTwist  = w => (S.loop||0)>0 || ROUTE.some((r,i)=> r.twist===w && stopIdx()>=i);
const itemsUnlocked = () => (S.loop||0)>0 ? PRIZES.length : Math.max(3, stop().maxItems);

// ---------- Состояние ----------
function fresh(){ return {
  v:2, coins:0,
  lifetime:0,                                   // суммарно ЗАРАБОТАНО (только earn, без подарков)
  shelf:{},                                     // id -> сколько призов на полке (источник дохода)
  prizes:[],                                    // виды, открытые хотя бы раз (множитель полки)
  upAim:0, upLights:0, upHost:0,                // уровни апгрейдов
  bestCascade:0,                                // лучшая цепочка за один бросок (лидерборд)
  throws:0, jackpots:0,                         // счётчики для чек-листа (живая игра, не офлайн)
  seeds:0, seedsUsed:0,                         // премиальная валюта и потраченные золотые
  route:0, routeDone:[], routeSeen:0, loop:0, finaleSeen:0,
  x2Until:0, lastGift:0,
  daily:{day:"",streak:0},
  tips:{},
  lastSeen:0,
  shortcutAsked:false, reviewAsked:false,
  lang:null, hintShown:false,
  time:Date.now()
};}
let S = fresh();
let testNoSave=false;   // тест-хук: подменить сейв и перезагрузиться, не дав игре его перезаписать

// ============================================================
//  ЭКОНОМИКА
//  Одно место, где собраны ВСЕ множители (idle-economy-balance.md §6).
//  Внутри источника — сложение, между источниками — умножение.
//  Единственный временный множитель — ×2 за ролик: худший случай ×2, не ×8.
// ============================================================
const MAX_AIM=12, MAX_LIGHTS=30, MAX_HOST=10;
const x2On          = () => Date.now() < S.x2Until;

// ── постоянные источники ──
const seedMult      = () => Math.pow(1.10, S.seedsUsed||0);   // золотые: умножение (§4.2)
const loopMult      = () => 1 + 0.25*(S.loop||0);             // пройденные круги: сложение
const passiveMult   = () => 1 + 0.25*S.upLights;              // апгрейд: сложение внутри источника
const shelfMult     = () => 1 + 0.08*S.prizes.length;         // каждый НОВЫЙ вид приза: +8% навсегда
const prizeCostMult = () => Math.max(0.5, 1 - 0.05*S.upHost);
const permMult      = () => passiveMult()*shelfMult()*seedMult()*loopMult();

// ── полка как источник дохода ──
const shelfCount = id => (S.shelf && S.shelf[id]) ? S.shelf[id] : 0;
const farmCount  = shelfCount;
const farmTotal  = () => PRIZES.reduce((a,p)=>a+shelfCount(p.id),0);
const collectionCount = () => S.prizes.length;
const ITEMS = PRIZES, ITEM_ICON = "🧸", ITEM_ICON2 = "🎪";
const baseIps = () => PRIZES.reduce((a,p)=> a + shelfCount(p.id)*p.ips, 0) * permMult();
const ips     = () => baseIps() * (x2On()?2:1);

// ── бросок ──
// «твёрдая рука» (твист) удваивает зону попадания по банке
const hitTolerance  = () => (1 + 0.09*S.upAim) * (hasTwist('w4')?2:1);
// «золотая банка» (твист) — одна банка в пирамиде, меняется раз в 20 секунд
const GOLD_EVERY = 20000;
const goldCanIdx = () => hasTwist('w2') ? (Math.floor(Date.now()/GOLD_EVERY) % pyramid().length) : -1;
// Награда за бросок НЕ должна зависеть от множителя пассивного дохода:
// иначе «Гирлянды» разгоняют и полку, и броски разом, и получается замкнутый
// контур, в котором доход растёт быстрее любой цены (маршрут проходился за
// восемь минут). Активная игра множится только полкой, золотыми и кругом.
// ...и считается ЗА БАНКУ: один бросок валит каскадом сразу 4-10 банок, поэтому
// цена банки во столько же раз меньше, чем награда за одно действие в соседних
// играх конвейера — иначе бросок оказывается на порядок выгоднее стежка.
const tokensPerCan  = () => (0.2 + 0.07*S.upAim) * shelfMult() * seedMult() * loopMult() * loopScale();

// ── цены ──
const aimCost    = () => S.upAim   >=MAX_AIM   ?0:Math.round(50*Math.pow(1.6,S.upAim)*loopScale());
const lightsCost = () => S.upLights>=MAX_LIGHTS?0:Math.round(70*Math.pow(1.7,S.upLights)*loopScale());
const hostCost   = () => S.upHost  >=MAX_HOST  ?0:Math.round(60*Math.pow(1.9,S.upHost)*loopScale());
const nextPrize  = () => PRIZES.find((p,i)=> !S.prizes.includes(p.id) && i<itemsUnlocked());
const prizeCost  = pz => Math.max(1, Math.round(pz.cost * Math.pow(COPY_MUL, shelfCount(pz.id)) * prizeCostMult() * loopScale()));
const upCost = () => { const n=nextPrize(); return n? prizeCost(n) : 0; };

// ============================================================
//  earn / grant — подарки НЕ идут в метрики прогресса
//  (idle-monetization.md §9, idle-economy-balance.md §7)
// ============================================================
function earn(a){ if(!(a>0)) return; S.coins+=a; S.lifetime=(S.lifetime||0)+a; }
function grant(a){ if(!(a>0)) return; S.coins+=a; }
function spend(a){ S.coins=Math.max(0, S.coins-a); }

// ── источники для целей чек-листа, специфичные для этой игры ──
const GOAL_SRC = {
  throws:   () => S.throws,

  jackpots: () => S.jackpots,
  seeds:    () => S.seedsUsed,
  shelfOne: () => PRIZES.some(p=>shelfCount(p.id)>=5) ? 1 : 0,
};
const hasProgress = () => S.prizes.length>0 || S.throws>=5;

// ---------- Сейвы ----------
function persist(force, flush){
  if(catchUp || testNoSave) return;   // во время досчёта офлайна не сохраняем на каждом шаге
  const now=Date.now();
  if(!force && now-saveT<10000) return;
  saveT=now;
  S.lastSeen=now;
  const raw=JSON.stringify(S);
  try{ localStorage.setItem(SAVE_KEY,raw); }catch(e){}
  if(player){ try{ player.setData({save:raw}, !!flush); }catch(e){} }
}
let lastFlushAt=0;
function flushSave(){
  const now=Date.now();
  if(now-lastFlushAt<3000) return;    // не жечь лимит запросов частым переключением вкладок
  lastFlushAt=now;
  persist(true, true);
}
document.addEventListener("visibilitychange", ()=>{ if(document.hidden) flushSave(); });
addEventListener("pagehide", flushSave);
function restore(raw){
  if(!raw) return;
  // битый/чужой сейв не должен заклинивать запуск: при ошибке разбора остаётся
  // ЧИСТЫЙ fresh(), а не наполовину слитый объект
  let hadRoute=true;
  try{
    const d=(typeof raw==="string")?JSON.parse(raw):(raw.save?JSON.parse(raw.save):raw);
    if(d&&typeof d==="object"){ hadRoute=(typeof d.route==="number"); S=Object.assign(fresh(),d); }
  }catch(e){ S=fresh(); return; }

  // неизвестный id приза (сейв из будущей версии) резолвится в «ничего», а не
  // в самый дорогой приз игры
  if(!Array.isArray(S.prizes)) S.prizes=[];
  S.prizes = S.prizes.filter(id=>!!PZ(id));
  // полка: в старых сейвах её нет — каждый открытый вид считаем за один приз,
  // чтобы действующий игрок не потерял свой доход
  if(!S.shelf || typeof S.shelf!=="object" || Array.isArray(S.shelf)) S.shelf={};
  const shelf={};
  PRIZES.forEach(p=>{ const n=Math.max(0, Math.round(Number(S.shelf[p.id])||0));
    if(n>0) shelf[p.id]=Math.min(n, 1e6); });
  S.prizes.forEach(id=>{ if(!shelf[id]) shelf[id]=1; });
  S.shelf=shelf;

  const num=(v,d)=>(typeof v==="number" && isFinite(v) && v>=0)?v:d;
  S.coins=num(S.coins,0); S.lifetime=num(S.lifetime,S.coins);
  S.upAim    = Math.min(MAX_AIM,    num(S.upAim,0)|0);
  S.upLights = Math.min(MAX_LIGHTS, num(S.upLights,0)|0);
  S.upHost   = Math.min(MAX_HOST,   num(S.upHost,0)|0);
  S.bestCascade=num(S.bestCascade,0)|0; S.throws=num(S.throws,0)|0; S.jackpots=num(S.jackpots,0)|0;
  S.seeds=num(S.seeds,0)|0; S.seedsUsed=num(S.seedsUsed,0)|0;
  S.loop=Math.min(MAX_LOOP,num(S.loop,0)|0);
  if(!S.daily || typeof S.daily!=="object") S.daily={day:"",streak:0};
  S.daily.streak=Math.min(7,Math.max(0,num(S.daily.streak,0)|0));
  if(typeof S.daily.day!=="string") S.daily.day="";
  if(!S.tips || typeof S.tips!=="object") S.tips={};   // поле появилось позже самой игры

  // ── миграция маршрута: у старого сейва полей маршрута нет ──
  // место вычисляем из уже достигнутого и ПРОМАТЫВАЕМ выполненное БЕЗ ВЫПЛАТ
  S.route=Math.min(ROUTE_N-1, Math.max(0, num(S.route,0)|0));
  if(!Array.isArray(S.routeDone)) S.routeDone=[];
  if(!hadRoute){
    let r=0;
    for(let i=0;i<ROUTE_N;i++){ if(goalsMetAt(i)) r=Math.min(ROUTE_N-1,i+1); else break; }
    S.route=r; S.routeDone=[]; S.routeSeen=Math.min(ROUTE_N-1,r+1);
    S.seedsUsed=0;                                    // золотые за прошлое не выдаём
  }
  S.routeSeen=Math.min(ROUTE_N-1, Math.max(S.route, num(S.routeSeen,0)|0));
  S.finaleSeen=num(S.finaleSeen,0)|0;
  S.lastSeen=num(S.lastSeen,0);
}

const AD_IDLE_S=30, AD_WARMUP_S2=90;
let lastInputAt=Date.now(), bootAt=Date.now();
addEventListener('pointerdown', ()=>{ lastInputAt=Date.now(); }, true);
function adAllowed(){
  if(!booted || !ysdk || !ysdk.adv || !ysdk.adv.showFullscreenAdv) return false;
  if(Date.now()-bootAt < AD_WARMUP_S2*1000) return false;      // не встречаем игрока рекламой
  if(Date.now()-lastInputAt < AD_IDLE_S*1000) return false;    // только в простое: площадка
                                                               // не советует показ во время игры
  if(adBusy) return false;
  if(document.hidden) return false;
  if(Date.now()<nextAdAt) return false;
  if(modalOpen) return false;              // не поверх открытой полки/магазина/улучшений
  return true;
}
function maybeInterstitial(){
  if(!adAllowed()) return;
  adBusy=true;
  const finish = wasShown => {
    adBusy=false;
    audioResume();
    nextAdAt = Date.now() + (wasShown? AD_GAP_S : AD_RETRY_S)*1000;
  };
  try{
    ysdk.adv.showFullscreenAdv({ callbacks:{
      onOpen:  ()=>audioSuspend(),
      onClose: was=>finish(!!was),
      onError: ()=>finish(false),
    }});
  }catch(e){ adBusy=false; }
}
function showRewarded(onReward){
  if(!ysdk || !ysdk.adv || !ysdk.adv.showRewardedVideo){ onReward(); return; }
  let paid=false;
  const pay=()=>{ if(!paid){ paid=true; onReward(); } };
  try{
    ysdk.adv.showRewardedVideo({ callbacks:{
      onOpen:     ()=>audioSuspend(),
      onRewarded: pay,
      onClose:    ()=>audioResume(),
      onError:    ()=>{ audioResume(); pay(); },
    }});
  }catch(e){ onReward(); }
}

// ============================================================
//  МАРШРУТ: движок чек-листа и переезда (playermotivation.md §3, §8)
// ============================================================
// требования, измеряемые в валюте, масштабируются кругом маршрута
const goalReq = (i,k) => {
  const g=GOALS[Math.min(GOALS.length-1,i)][k];
  return g.t==='income' ? g.n*loopScale() : g.n;
};
const goalType = (i,k) => GOALS[Math.min(GOALS.length-1,i)][k].t;
function goalCur(i,k){
  const t=goalType(i,k);
  if(t==='income') return baseIps();     // без временных множителей: цель — устойчивый доход
  if(t==='collect') return collectionCount();
  return GOAL_SRC[t] ? GOAL_SRC[t]() : 0;
}
const goalMet  = (i,k) => goalCur(i,k) >= goalReq(i,k);
const goalsMetAt = i => [0,1,2].every(k=>goalMet(i,k));
const stopReady  = () => goalsMetAt(stopIdx());
const isFinalStop = () => stopIdx() >= ROUTE_N-1;
function goalText(i,k){
  const g=GOALS[Math.min(GOALS.length-1,i)][k];
  if(g.t==='income')  return T("gIncome")+" "+fmt(goalReq(i,k))+" "+T("ipsUnit");
  if(g.t==='collect') return T("gCollect")+" "+g.n;
  return T("g_"+g.t) + (g.n>1 ? " ×"+g.n : "");
}
function goalProgress(i,k){
  const g=GOALS[Math.min(GOALS.length-1,i)][k];
  if(g.n<=1) return goalMet(i,k)?"✓":"—";
  return fmt(Math.min(goalCur(i,k),goalReq(i,k)))+"/"+fmt(goalReq(i,k));
}
// ближайшая незакрытая цель — то, что видно в шапке (средний горизонт)
function nextGoal(){
  const i=stopIdx();
  for(let k=0;k<3;k++) if(!goalMet(i,k)) return {k, text:goalText(i,k), prog:goalProgress(i,k)};
  return null;
}
// награда за остановку — ТОЛЬКО grant, иначе подарки разгоняют прогресс
const stopSeeds = i => (i>=ROUTE_N-1 ? 6 : 2);
function advanceRoute(){
  if(!stopReady()) return false;
  const i=stopIdx();
  S.seeds += stopSeeds(i);
  grant(Math.max(100, baseIps()*180));
  sfx("buy");
  if(isFinalStop()){
    // псевдофинал: настоящий экран «ты дошёл», после него — второй круг.
    // Ничего не отнимаем, прибавка за пройденный путь остаётся навсегда.
    S.loop=Math.min(MAX_LOOP,(S.loop||0)+1); S.finaleSeen=(S.finaleSeen||0)+1;
    S.route=0; S.routeSeen=Math.max(S.routeSeen,1);
    persist(true); refreshHud(); openModal('finale');
    askReview();
    return true;
  }
  S.route=i+1;
  S.routeSeen=Math.min(ROUTE_N-1, Math.max(S.routeSeen, S.route+1));
  persist(true); refreshHud();
  toast(T("movedTo")+" "+T(stop().id));
  rebuildScene();
  openModal('route');
  return true;
}

// ============================================================
//  ОФЛАЙН-ДОХОД (idle-monetization.md §5)
//  Три независимых порога: MIN — с какой отлучки вообще начисляем,
//  CAP — потолок начисления, REPORT — с какой отлучки показываем сводку.
//  CAP > REPORT, иначе появляется мёртвая зона: игрок между ними
//  получает максимум, но окна не видит и не понимает, что игра работала.
// ============================================================
const OFF_MIN_S = 60, OFF_CAP_S = 12*3600, OFF_REPORT_S = 4*3600;
const FF_STEP = 15;
// Предел шагов выводим ИЗ потолка, а не пишем числом — иначе они разъедутся
// и потолок молча обрежется.
const FF_MAX_STEPS = Math.ceil(OFF_CAP_S/FF_STEP) + 10;
let catchUp=false;               // идёт досчёт: без сейвов, звука, частиц и целей
let offlineReport=null;

function fastForward(seconds){
  catchUp=true; window.__silent=true;
  try{
    let rem=seconds, guard=0;
    while(rem>0 && guard++<FF_MAX_STEPS){ simulateTick(Math.min(FF_STEP,rem)); rem-=FF_STEP; }
  } finally { catchUp=false; window.__silent=false; }
}
function checkOffline(){
  const now=Date.now();
  const last=S.lastSeen||0;
  S.lastSeen=now;
  if(!last) return false;
  const away=Math.floor((now-last)/1000);
  if(away<OFF_MIN_S) return false;
  const capped = away>OFF_CAP_S;
  const used = Math.min(away, OFF_CAP_S);
  const before=S.coins;
  fastForward(used);
  const gained=S.coins-before;
  offlineReport={away, used, capped, gained, x2Taken:false};
  return away>=OFF_REPORT_S || gained>0;
}
// Прогноз показываем, ТОЛЬКО когда доход реально пойдёт. Если условий нет —
// пустая строка, а не уговоры «купи ещё»: реклама своих механик раздражает.
function offlineForecast(){
  if(baseIps()<=0) return "";
  return T("offForecast")+fmt(baseIps()*3600)+"/"+T("hOur");
}

// ============================================================
//  ЕЖЕДНЕВНАЯ СЕРИЯ (idle-monetization.md §4)
//  Цикл 7 дней, награда привязана к текущему темпу игрока (фиксированная
//  сумма через месяц превращается в мусор), день определяем по строке
//  даты, а не по таймстемпу — иначе «сутки» ездят.
// ============================================================
const dayKey = d => new Date(d).toISOString().slice(0,10);
const dailyReward = i => Math.max(120, Math.round(baseIps()*60*(2+i)));
const dailySeeds  = i => (i===2||i===6) ? 1 : 0;    // премиальная валюта на 3-й и 7-й день
let dailyPending=false;
function checkDaily(){
  const today=dayKey(Date.now());
  if(S.daily.day===today){ dailyPending=false; return false; }
  // окно «Серия: 1 день» на самом первом запуске выглядит абсурдно и перекрывает
  // обучение — показываем только тем, у кого уже есть прогресс
  if(!hasProgress()){ dailyPending=false; return false; }
  const yest=dayKey(Date.now()-86400000);
  S.daily.streak = (S.daily.day===yest) ? Math.min(7, S.daily.streak+1) : 1;
  dailyPending=true;
  return true;
}
function claimDaily(x2){
  if(!dailyPending) return;
  const i=Math.max(0,Math.min(6,S.daily.streak-1));
  const give = ()=>{
    grant(dailyReward(i)*(x2?2:1));                 // подарок — grant, не earn
    S.seeds += dailySeeds(i);
    S.daily.day=dayKey(Date.now()); dailyPending=false;
    refreshHud(); persist(true); sfx("coin"); closeModal();
    maybeInterstitial();                            // закрытие окна — естественная пауза
  };
  if(x2) showRewarded(give); else give();
}

// ============================================================
//  ПОДСКАЗКИ (idle-monetization.md §7)
//  Отдельная от обучения система: триггеры условные, а не последовательные,
//  и показываются ВСЕМ, включая давних игроков, — они и есть основная
//  аудитория. По одной за раз и один раз навсегда.
// ============================================================
let tipNow=null, tipTimer=0;
function showTip(tip){
  const el=$("bubble"), tgt=$(tip.target);
  if(!el||!tgt) return;
  tipNow=tip;
  el.textContent=tip.text();
  const r=tgt.getBoundingClientRect();
  const side = r.left > innerWidth*0.55;
  el.className = "bubble" + (side?" side":"");
  // Ширина пузыря задана в CSS явно: браузер считает её из остатка места
  // справа от left ДО применения transform, и у кнопки в правой части экрана
  // текст схлопнулся бы в колонку по слову в строке.
  el.style.left = (side ? r.left-8 : r.left+r.width/2)+"px";
  el.style.top  = (side ? r.top+r.height/2 : r.top-10)+"px";
  el.hidden=false;
  tgt.classList.add("tipTarget");
  clearTimeout(tipTimer); tipTimer=setTimeout(closeTip, 11000);
}
function closeTip(){
  if(!tipNow) return;
  const tgt=$(tipNow.target); if(tgt) tgt.classList.remove("tipTarget");
  S.tips[tipNow.id]=true; tipNow=null;
  const el=$("bubble"); if(el) el.hidden=true;
  persist(true);
}
function tipTick(){
  if(tipNow || !booted) return;
  if(modalOpen || dailyPending || offlineReport) return;   // окно возвращения → ежедневка → подсказка
  if(!S.hintShown) return;                                 // во время обучающей подсказки молчим
  const tip=TIPS.find(x=> !S.tips[x.id] && x.when());
  if(tip) showTip(tip);
}
// любое действие игрока снимает подсказку: она уже сделала своё дело
document.addEventListener('pointerdown', ()=>{ if(tipNow) closeTip(); }, true);

// ============================================================
//  ЯРЛЫК НА ГЛАВНЫЙ ЭКРАН И ЗАПРОС ОЦЕНКИ (idle-monetization.md §6)

async function maybeShortcut(){
  if(S.shortcutAsked || !ysdk || !ysdk.shortcut) return;
  try{
    const r=await ysdk.shortcut.canShowPrompt();
    if(r && r.canShow) openModal('shortcut');
  }catch(e){}
}
async function doShortcut(){
  S.shortcutAsked=true; persist(true);
  try{
    // showPrompt() открывает нативный диалог — зовём строго из обработчика нажатия,
    // иначе браузер может его не показать
    const res=await ysdk.shortcut.showPrompt();
    if(res && res.outcome==='accepted'){ S.seeds+=1; refreshHud(); persist(true); toast(T("seedGot")+" +1"); }
  }catch(e){}
  closeModal();
}
async function askReview(){
  if(S.reviewAsked || !ysdk || !ysdk.feedback) return;
  S.reviewAsked=true; persist(true);
  try{
    const can=await ysdk.feedback.canReview();     // обязателен перед requestReview
    if(can && can.value) await ysdk.feedback.requestReview();
  }catch(e){}
}

// ── один шаг собственной симуляции игры (его же крутит досчёт офлайна) ──
// Твист «зазывала-помощник» работает и офлайн, но НЕ засчитывается в цели
// чек-листа: иначе за ночь помощник закрывает их сам.
const AUTO_EVERY = 15;
let autoAcc = 0;
function simulateTick(sec){
  earn(baseIps()*sec);
  if(hasTwist('w1')){
    autoAcc+=sec;
    while(autoAcc>=AUTO_EVERY){ autoAcc-=AUTO_EVERY; autoToss(); }
  }
}
// сцену пересобираем при переезде — палитра места меняется
function rebuildScene(){ if(catchUp) return; initRound(); rebuildBg(); }
function finaleArt(){

  c.style.cssText="width:100%;max-width:220px;display:block;margin:0 auto 6px";
  try{ drawPrize(c.getContext('2d'), PRIZES[PRIZES.length-1], 110, 80, 2.6); }catch(e){}
  return c;
}

// ---------- HUD ----------
const $ = id => document.getElementById(id);
// Округляем ТОЛЬКО при показе — начисления остаются дробными.
// Суффиксов хватает далеко за пределы Number.MAX_SAFE_INTEGER, иначе
// форматирование выдаёт «1000T» и выглядит недоделкой.
const SUFFIX = ["","K","M","B","T","Qa","Qi","Sx","Sp","Oc","No","Dc"];
function fmt(n){
  n = Number(n)||0;
  if(n<1000) return Math.floor(n).toString();
  let i=0; while(n>=1000 && i<SUFFIX.length-1){ n/=1000; i++; }
  return (n<10 ? n.toFixed(2) : n<100 ? n.toFixed(1) : Math.floor(n).toString()) + SUFFIX[i];
}
function fmtDur(sec){
  sec=Math.max(0,Math.floor(sec));
  const h=Math.floor(sec/3600), m=Math.floor((sec%3600)/60);
  return h>0 ? (h+" "+T("hOur")+(m?" "+m+" "+T("hMin"):"")) : (m+" "+T("hMin"));
}
const giftAmt  = () => Math.max(80, Math.round(baseIps()*45));

function refreshHud(){
  if(catchUp) return;   // досчёт зовёт обычный игровой шаг — интерфейс ему не нужен
  $("coinsV").textContent = fmt(S.coins);
  $("bestV").textContent  = Math.min(S.bestCascade, pyramid().length)+"/"+pyramid().length;
  $("coinsL").textContent = T("coins");
  $("bestL").textContent  = T("streak");
  $("giftT").textContent  = T("gift");
  $("giftS").textContent  = "+"+fmt(giftAmt());
  const on=x2On();
  $("x2T").textContent    = T("x2");
  $("x2S").textContent    = on? Math.ceil((S.x2Until-Date.now())/60000)+(lang()==="ru"?" мин":" min") : (lang()==="ru"?"5 мин":"5 min");
  $("x2Btn").classList.toggle("off", on);
  $("langTxt").textContent = lang()==="ru" ? "RU" : "EN";
  // премиальная валюта появляется в шапке только когда она у игрока есть
  const sc=$("seedChip"); sc.hidden = !(S.seeds>0 || S.seedsUsed>0);
  $("seedV").textContent = fmt(S.seeds); $("seedL").textContent = T("seeds");
  refreshRouteBar();
  document.documentElement.setAttribute("lang", lang());
  if(modalOpen) buildModal(modalOpen);
}
// средний горизонт: текущее место, три точки чек-листа и ближайшая цель
function refreshRouteBar(){
  const i=stopIdx();
  $("rbName").textContent = T(ROUTE[i].id);
  $("rbNum").textContent  = (i+1)+"/"+ROUTE_N + ((S.loop>0)?(" · "+T("loopWord")+" "+(S.loop+1)):"");
  for(let k=0;k<3;k++) $("rd"+k).classList.toggle("on", goalMet(i,k));
  const g=nextGoal(), row=$("rbGoal");
  if(g){ $("rbGoalT").textContent=g.text; $("rbGoalV").textContent=g.prog; row.classList.remove("ready"); }
  else { $("rbGoalT").textContent=T("moveOn")+" →"; $("rbGoalV").textContent="✓"; row.classList.add("ready"); }
}
let toastT;
function toast(msg){ if(catchUp) return; const el=$("toast"); el.textContent=msg; el.classList.add("on");
  clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove("on"),1600); }

// ---------- Действия: покупки ----------
// Приз можно взять сколько угодно раз: каждый на полке приносит жетоны,
// цена следующего растёт мелким множителем. Первый экземпляр вида ещё и
// открывает постоянный множитель полки.
function buyPrize(id){
  const pz=PZ(id); if(!pz) return false;
  if(PRIZES.indexOf(pz) >= itemsUnlocked()) return false;   // вид открывается местом маршрута
  const c=prizeCost(pz);
  if(S.coins<c){ toast(T("need")); sfx("error"); return false; }
  spend(c);
  S.shelf[id]=shelfCount(id)+1;
  const first = !S.prizes.includes(id);
  if(first){ S.prizes.push(id); toast(T("newPrize")+" "+nm(pz)); }
  else toast(T("bought")+" "+nm(pz)+" ×"+shelfCount(id));
  if(S.prizes.length>=PRIZES.length && first) setTimeout(()=>toast(T("allPrizes")), 700);
  refreshHud(); persist(true); if(first) rebuildBg(); sfx("buy");
  return true;
}
function plantSeed(){
  if(S.seeds<=0){ toast(T("seedNone")); sfx("error"); return false; }
  S.seeds--; S.seedsUsed++;
  refreshHud(); persist(true); sfx("buy");
  return true;
}
function buyUp(key){
  const map={upAim:aimCost,upLights:lightsCost,upHost:hostCost};
  const max={upAim:MAX_AIM,upLights:MAX_LIGHTS,upHost:MAX_HOST};
  if(S[key]>=max[key]) return false;
  const c=map[key](); if(S.coins<c){ toast(T("need")); sfx("error"); return false; }
  S.coins-=c; S[key]++; refreshHud(); persist(true); sfx("buy"); return true;
}
function claimGift(){
  showRewarded(()=>{ const g=giftAmt(); S.coins+=g; refreshHud(); persist(true); sfx("coin");
    toast(T("giftGot")+" +"+fmt(g)); });
}
function claimX2(){
  if(x2On()){ toast(T("x2on")); return; }
  showRewarded(()=>{ S.x2Until=Date.now()+300000; refreshHud(); persist(true); sfx("buy");
    toast(T("x2got")); });
}


// ---------- Модалки ----------
// "Призы" и "Полка" были двумя отдельными боковыми кнопками с почти одинаковым назначением
// (обе — про коллекцию призовых игрушек, отличался только режим: купить / посмотреть собранное);
// объединены в одну модалку с внутренним переключателем вкладок — освобождает боковой ряд
// с 4 круглых кнопок до 3, и оставшаяся кнопка призов честно крупнее остальных (см. .rbtn.primary).
let modalOpen=null, prizeTab='buy';
function openModal(kind){ if(catchUp) return; modalOpen=kind; buildModal(kind); $("modal").classList.remove("hidden"); }
function closeModal(){
  // окно возвращения закрыто — отчёт отработал; иначе он навсегда блокирует
  // очередь «окно возвращения → ежедневка → подсказка»
  if(modalOpen==='offline') offlineReport=null;
  modalOpen=null; $("modal").classList.add("hidden");
}
function prizeThumb(pz){
  const c=document.createElement('canvas'); c.width=104; c.height=88;
  const g=c.getContext('2d'); drawPrize(g,pz,52,50,1.7); return c;
}
function buildModal(kind){
  const body=$("mBody"); const can=(cost)=>S.coins>=cost;
  if(kind==='prizes'){
    $("mTitle").textContent = prizeTab==='buy' ? T("shopTitle") : T("shelfTitle")+" ("+S.prizes.length+"/"+PRIZES.length+")";
    body.innerHTML="";
    const tabs=document.createElement('div'); tabs.className="tabs";
    const tBuy=document.createElement('button'); tBuy.id="prizeTabBuy";
    tBuy.className="tabBtn"+(prizeTab==='buy'?" active":""); tBuy.textContent=T("tabBuy");
    tBuy.onclick=()=>{ prizeTab='buy'; buildModal('prizes'); };
    const tShelf=document.createElement('button'); tShelf.id="prizeTabShelf";
    tShelf.className="tabBtn"+(prizeTab==='shelf'?" active":""); tShelf.textContent=T("tabShelf");
    tShelf.onclick=()=>{ prizeTab='shelf'; buildModal('prizes'); };
    tabs.appendChild(tBuy); tabs.appendChild(tShelf); body.appendChild(tabs);
    if(prizeTab==='buy'){
      PRIZES.forEach((pz,pi)=>{
        const n=shelfCount(pz.id);
        const row=document.createElement('div'); row.className="row";
        const th=prizeThumb(pz); th.className="thumb"; row.appendChild(th);

function rr(a,b){ return a+(b-a)*Math.random(); }
function scallopY(xFrac,n,base,depth){ const segT=Math.max(0,Math.min(n-0.0001,xFrac*n)); const seg=Math.floor(segT); const t=segT-seg; return base+2*t*(1-t)*depth; }

// ── обязательные цветовые хелперы (RUNBOOK «Модельки: стандарт качества») ──
function hexRgb(h){ h=h.replace('#',''); if(h.length===3) h=h.split('').map(c=>c+c).join('');
  const n=parseInt(h,16); return [n>>16&255, n>>8&255, n&255]; }
function shade(hex, amt){
  const [r,g,b]=hexRgb(hex);
  const f=v=>Math.max(0,Math.min(255,Math.round(amt>=0 ? v+(255-v)*amt : v*(1+amt))));
  return 'rgb('+f(r)+','+f(g)+','+f(b)+')';
}
function rgba(hex, a){ const [r,g,b]=hexRgb(hex); return 'rgba('+r+','+g+','+b+','+a+')'; }
function sphereFill(g,cx,cy,r,base){
  const grad=g.createRadialGradient(cx-r*0.35,cy-r*0.5,r*0.1,cx,cy,r*1.15);
  grad.addColorStop(0,shade(base,.42)); grad.addColorStop(.55,base); grad.addColorStop(1,shade(base,-.22));
  return grad;
}
function vertFill(g,x0,y0,x1,y1,base){
  const grad=g.createLinearGradient(x0,y0,x1,y1);
  grad.addColorStop(0,shade(base,.32)); grad.addColorStop(1,shade(base,-.2));
  return grad;
}
function glossSpot(g,cx,cy,r){
  const grad=g.createRadialGradient(cx,cy,0,cx,cy,r);
  grad.addColorStop(0,'rgba(255,255,255,.62)'); grad.addColorStop(1,'rgba(255,255,255,0)');
  return grad;
}
function starPath(g,cx,cy,rOuter,rInner,rot){
  rot = rot==null? -Math.PI/2 : rot;
  g.beginPath();
  for(let k=0;k<5;k++){
    const oa=rot+k*2*Math.PI/5, ia=oa+Math.PI/5;
    const ox=cx+Math.cos(oa)*rOuter, oy=cy+Math.sin(oa)*rOuter;
    const ix=cx+Math.cos(ia)*rInner, iy=cy+Math.sin(ia)*rInner;
    if(k===0) g.moveTo(ox,oy); else g.lineTo(ox,oy);
    g.lineTo(ix,iy);
  }
  g.closePath();
}

function buildBg(){

  g.fillStyle=sky; g.fillRect(0,0,W,H*0.62);

  g.fillStyle='#3A2450';
  g.beginPath(); g.moveTo(0,H*0.6); g.quadraticCurveTo(W*0.5,H*0.54,W,H*0.6); g.lineTo(W,H*0.62); g.lineTo(0,H*0.62); g.closePath(); g.fill();

  // тент-канопи (полосатая занавесь с рядом круглых scallop-фестонов по нижнему краю)
  const stripeCols=['#E8536B','#FFF6E8'];
  const scallops=9;
  const tentBaseY=tentDrapeY*0.42, tentDepth=tentDrapeY*0.58;
  g.save();
  g.beginPath(); g.moveTo(0,0); g.lineTo(W,0); g.lineTo(W,tentBaseY);
  for(let i=scallops;i>0;i--){
    const x1=W*i/scallops, x0=W*(i-1)/scallops, mx=(x0+x1)/2;
    g.quadraticCurveTo(mx, tentBaseY+tentDepth, x0, tentBaseY);
  }
  g.lineTo(0,0); g.closePath(); g.clip();
  for(let i=0;i<scallops+2;i++){ g.fillStyle=stripeCols[i%2]; g.fillRect(W*(i-1)/scallops, 0, W/scallops+2, tentDrapeY+20); }
  g.restore();
  g.strokeStyle=INK; g.lineWidth=3;
  g.beginPath(); g.moveTo(0,tentBaseY);
  for(let i=0;i<scallops;i++){
    const x0=W*i/scallops, x1=W*(i+1)/scallops, mx=(x0+x1)/2;
    g.quadraticCurveTo(mx, tentBaseY+tentDepth, x1, tentBaseY);
  }
  g.stroke();

  bulbs=[];
  for(let i=0;i<12;i++){ const t=i/11; const x=W*0.05+t*W*0.9;
    bulbs.push({x, y:scallopY(x/W,scallops,tentBaseY,tentDepth)-2, ph:i*0.5}); }

  g.strokeStyle=shade('#8A5A32',-.1); g.lineWidth=10;
  g.beginPath(); g.moveTo(W*0.06,tentDrapeY); g.lineTo(W*0.06,counterTopY); g.stroke();
  g.beginPath(); g.moveTo(W*0.94,tentDrapeY); g.lineTo(W*0.94,counterTopY); g.stroke();

  const curt=g.createLinearGradient(0,tentDrapeY,0,counterTopY);
  curt.addColorStop(0,'#6B3F72'); curt.addColorStop(1,'#4A2A52');
  g.fillStyle=curt; g.fillRect(W*0.06,tentDrapeY,W*0.88,counterTopY-tentDrapeY);
  g.strokeStyle='rgba(255,255,255,.08)'; g.lineWidth=2;
  for(let x=W*0.10;x<W*0.92;x+=W*0.07){ g.beginPath(); g.moveTo(x,tentDrapeY); g.quadraticCurveTo(x+W*0.02,(tentDrapeY+counterTopY)/2,x,counterTopY); g.stroke(); }

  g.fillStyle=vertFill(g,0,prizeShelfY-4,0,prizeShelfY+6,'#B98F52');
  g.fillRect(W*0.08,prizeShelfY,W*0.84,8);
  g.strokeStyle=INK; g.lineWidth=2; g.strokeRect(W*0.08,prizeShelfY,W*0.84,8);
  if(S.prizes.length){
    const n=S.prizes.length, totalW=Math.min(W*0.8,34*n), gap=totalW/n;
    const startX=W*0.5-totalW/2+gap*0.5;
    S.prizes.forEach((id,i)=>{ drawPrize(g, PZ(id), startX+i*gap, prizeShelfY-6, 0.55); });
  }

  const wood=g.createLinearGradient(0,counterTopY,0,H);
  wood.addColorStop(0,'#C9925A'); wood.addColorStop(1,'#8A5A32');
  g.fillStyle=wood; g.fillRect(0,counterTopY,W,H-counterTopY);
  g.strokeStyle='rgba(70,40,16,.25)'; g.lineWidth=2;
  for(let x=0;x<W;x+=30){ g.beginPath(); g.moveTo(x,counterTopY+4); g.lineTo(x+8,H); g.stroke(); }
  g.strokeStyle=INK; g.lineWidth=4;
  g.beginPath(); g.moveTo(0,counterTopY); g.lineTo(W,counterTopY); g.stroke();
  g.fillStyle='rgba(255,255,255,.15)'; g.fillRect(0,counterTopY+4,W,3);

  const vg=g.createRadialGradient(W/2,H*0.4,Math.min(W,H)*0.25,W/2,H*0.4,Math.max(W,H)*0.8);
  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(20,10,30,.30)');
  g.fillStyle=vg; g.fillRect(0,0,W,H);
}

function drawFerrisWheel(angle){
  const cx=ferrisCX, cy=ferrisCY, r=ferrisR;
  ctx.strokeStyle=rgba('#FFE9A8',.4); ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(cx-r*0.5,cy+r*0.75); ctx.lineTo(cx,cy); ctx.lineTo(cx+r*0.5,cy+r*0.75); ctx.stroke();
  ctx.strokeStyle=rgba('#FFE9A8',.85); ctx.lineWidth=4;
  ctx.beginPath(); ctx.arc(cx,cy,r,0,6.28); ctx.stroke();
  const spokes=8;
  for(let i=0;i<spokes;i++){
    const a=angle+i*2*Math.PI/spokes;
    const x=cx+Math.cos(a)*r, y=cy+Math.sin(a)*r;
    ctx.strokeStyle=rgba('#FFE9A8',.7); ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(x,y); ctx.stroke();
    ctx.fillStyle = i%2? '#FF8A5B':'#6FCF97';
    ctx.beginPath(); ctx.arc(x,y,r*0.1,0,6.28); ctx.fill();
    ctx.strokeStyle=INK; ctx.lineWidth=1.4; ctx.stroke();
  }
  ctx.fillStyle='#FFE9A8'; ctx.beginPath(); ctx.arc(cx,cy,r*0.11,0,6.28); ctx.fill();
  ctx.strokeStyle=INK; ctx.lineWidth=1.4; ctx.stroke();
}
function drawBulbs(t){

    if(on){ ctx.fillStyle='rgba(255,220,140,.35)'; ctx.beginPath(); ctx.arc(b.x,b.y,9*charScale,0,6.28); ctx.fill(); }
  });
}

// ---------- Банки: пирамида 3-2-1, цепная реакция ----------
// Две раскладки пирамиды: базовая 3+2+1 и высокая 4+3+2+1 («высокая пирамида» —
// твист четвёртого места). SUPPORTS описывает, что на чём держится: сбитая
// опора роняет всё, что на ней стояло.
const PYRAMID_SMALL = [{row:0,dx:-1},{row:0,dx:0},{row:0,dx:1},{row:1,dx:-0.5},{row:1,dx:0.5},{row:2,dx:0}];
const SUPPORTS_SMALL = {3:[0,1],4:[1,2],5:[3,4]};
const PYRAMID_BIG = [
  {row:0,dx:-1.5},{row:0,dx:-0.5},{row:0,dx:0.5},{row:0,dx:1.5},
  {row:1,dx:-1},{row:1,dx:0},{row:1,dx:1},
  {row:2,dx:-0.5},{row:2,dx:0.5},
  {row:3,dx:0},
];
const SUPPORTS_BIG = {4:[0,1],5:[1,2],6:[2,3],7:[4,5],8:[5,6],9:[7,8]};
const pyramid  = () => hasTwist('w3') ? PYRAMID_BIG : PYRAMID_SMALL;
const supports = () => hasTwist('w3') ? SUPPORTS_BIG : SUPPORTS_SMALL;
let cans=[];
function canCenter(row,dx){ return { x: shelfCX+dx*canSpacing, y: shelfBaseY-canR-row*canRowH }; }
// Автобросок от твиста «зазывала-помощник»: работает и офлайн, но НЕ
// засчитывается в цели чек-листа — иначе за ночь помощник закрывает их сам.
function autoToss(){
  const up=cans.filter(c=>c.state==='up');
  if(!up.length){ initRound(); return false; }
  earn(tokensPerCan()*Math.max(1, Math.round(up.length*0.4)));
  const victim=up[0];
  const fallen=computeCascade(victim.idx);
  fallen.forEach(i=>{ const c=cans.find(cc=>cc.idx===i); if(c) c.state='gone'; });
  if(cans.every(c=>c.state!=='up')) initRound();
  return true;
}
function initRound(){
  cans = pyramid().map((p,i)=>{ const c=canCenter(p.row,p.dx);
    return {idx:i,x:c.x,y:c.y,state:'up',fx:c.x,fy:c.y,fvx:0,fvy:0,frot:0,fvr:0,falpha:1}; });
}
function repositionCans(){
  cans.forEach(c=>{ const p=pyramid()[c.idx]; if(!p) return; const cc=canCenter(p.row,p.dx); c.x=cc.x; c.y=cc.y; if(c.state==='up'){ c.fx=cc.x; c.fy=cc.y; } });
}
function computeCascade(hitIdx){
  const fallen=new Set([hitIdx]);
  let changed=true;
  while(changed){
    changed=false;
    const SUP=supports();
    for(const idxStr in SUP){
      const i=+idxStr;
      if(fallen.has(i)) continue;
      if(SUP[i].some(s=>fallen.has(s))){ fallen.add(i); changed=true; }
    }
  }
  return fallen;
}
function drawCanShape(g,x,y,r,rot,alpha){
  g.save(); g.globalAlpha=alpha; g.translate(x,y); g.rotate(rot||0);
  g.strokeStyle=INK; g.lineWidth=1.8;
  const w=r*1.02, h=r*1.7;
  g.fillStyle=vertFill(g,0,-h*0.5,0,h*0.5,'#E3E8F0');
  g.fillRect(-w,-h*0.5,w*2,h); g.strokeRect(-w,-h*0.5,w*2,h);
  g.fillStyle='#E8536B'; g.fillRect(-w,-h*0.14,w*2,h*0.46); g.strokeRect(-w,-h*0.14,w*2,h*0.46);
  g.fillStyle='#fff'; starPath(g,0,0.1,r*0.24,r*0.1); g.fill();
  g.fillStyle=sphereFill(g,0,-h*0.5,w,'#EAEFF5');
  g.beginPath(); g.ellipse(0,-h*0.5,w,r*0.26,0,0,6.28); g.fill(); g.stroke();
  g.fillStyle='#B7BFC9'; g.beginPath(); g.ellipse(0,h*0.5,w,r*0.26,0,0,Math.PI); g.fill();
  g.fillStyle=glossSpot(g,-w*0.4,0,w*0.5); g.beginPath(); g.ellipse(-w*0.32,0,w*0.32,h*0.4,0,0,6.28); g.fill();
  g.restore();
}
function drawCans(){
  cans.forEach(c=>{
    if(c.state==='gone') return;
    if(c.state==='up') drawCanShape(ctx,c.x,c.y,canR,0,1);
    else drawCanShape(ctx,c.fx,c.fy,canR,c.frot,Math.max(0,c.falpha));
  });
}

// ---------- Рогатка и мешочек: тяни назад, отпускай — летит по параболе ----------
const G=700, POWER=8, MIN_PULL=18;
let pulling=false, pullX=0, pullY=0, ball=null, mascotCheer=0;
function toLogical(clientX,clientY){ const r=cv.getBoundingClientRect(); return {x:clientX-r.left, y:clientY-r.top}; }
function updatePull(x,y){
  let dx=x-anchorX, dy=y-anchorY;
  const dist=Math.hypot(dx,dy);
  if(dist>maxPull){ const k=maxPull/dist; dx*=k; dy*=k; }
  pullX=anchorX+dx; pullY=anchorY+dy;
}
function releasePull(){
  const dx=pullX-anchorX, dy=pullY-anchorY;
  if(Math.hypot(dx,dy)<MIN_PULL){ pullX=anchorX; pullY=anchorY; return; }
  ball={x:pullX,y:pullY,vx:-dx*POWER,vy:-dy*POWER,r:ballR,trail:[]};
  pullX=anchorX; pullY=anchorY;
  if(!S.hintShown){ S.hintShown=true; persist(true); }
  sfx("tap");
}
cv.addEventListener("pointerdown", e=>{
  if(modalOpen || ball) return;
  const p=toLogical(e.clientX,e.clientY);
  pulling=true; updatePull(p.x,p.y);
});
addEventListener("pointermove", e=>{ if(!pulling) return; const p=toLogical(e.clientX,e.clientY); updatePull(p.x,p.y); });
addEventListener("pointerup", e=>{ if(!pulling) return; pulling=false; releasePull(); });

function drawSling(){
  const postH=Math.min(H*0.15,86)*charScale;
  const leftX=anchorX-22*charScale, rightX=anchorX+22*charScale, baseY=anchorY+6, topY=anchorY-postH;
  const tipL={x:anchorX-14*charScale,y:topY}, tipR={x:anchorX+14*charScale,y:topY};
  ctx.strokeStyle=shade('#8A5A32',-.15); ctx.lineWidth=7*charScale; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(leftX,baseY); ctx.lineTo(tipL.x,tipL.y); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(rightX,baseY); ctx.lineTo(tipR.x,tipR.y); ctx.stroke();
  ctx.strokeStyle=INK; ctx.lineWidth=1.6;
  ctx.beginPath(); ctx.moveTo(leftX,baseY); ctx.lineTo(tipL.x,tipL.y); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(rightX,baseY); ctx.lineTo(tipR.x,tipR.y); ctx.stroke();
  ctx.strokeStyle='#C9A36B'; ctx.lineWidth=3*charScale;
  ctx.beginPath(); ctx.moveTo(tipL.x,tipL.y); ctx.lineTo(pullX,pullY); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(tipR.x,tipR.y); ctx.lineTo(pullX,pullY); ctx.stroke();
  if(!ball){
    ctx.fillStyle=sphereFill(ctx,pullX,pullY,9*charScale,'#B98F52');
    ctx.beginPath(); ctx.ellipse(pullX,pullY,9*charScale,7*charScale,0,0,6.28); ctx.fill();
    ctx.strokeStyle=INK; ctx.lineWidth=1.4; ctx.stroke();
  }
}
function drawTrajPreview(){
  if(!pulling) return;
  const dx=pullX-anchorX, dy=pullY-anchorY;
  if(Math.hypot(dx,dy)<MIN_PULL) return;
  let vx=-dx*POWER, vy=-dy*POWER, x=pullX, y=pullY;
  ctx.strokeStyle=rgba('#FFC94A',.7); ctx.setLineDash([5,6]); ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(x,y);
  for(let i=0;i<14;i++){ x+=vx*0.05; y+=vy*0.05; vy+=G*0.05; ctx.lineTo(x,y); if(y>H) break; }
  ctx.stroke(); ctx.setLineDash([]);
}
function drawBall(){
  if(!ball) return;
  ball.trail.forEach((p,i)=>{ ctx.globalAlpha=(i/ball.trail.length)*0.3; ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.arc(p.x,p.y,ball.r*0.7,0,6.28); ctx.fill(); });
  ctx.globalAlpha=1;
  ctx.fillStyle=sphereFill(ctx,ball.x,ball.y,ball.r,'#C9A36B');
  ctx.beginPath(); ctx.arc(ball.x,ball.y,ball.r,0,6.28); ctx.fill();
  ctx.strokeStyle=INK; ctx.lineWidth=1.4; ctx.stroke();
  ctx.strokeStyle='#8A5A32'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(ball.x-ball.r*0.5,ball.y); ctx.lineTo(ball.x+ball.r*0.5,ball.y);
  ctx.moveTo(ball.x,ball.y-ball.r*0.5); ctx.lineTo(ball.x,ball.y+ball.r*0.5); ctx.stroke();
}
function resolveHit(hitIdx){
  const fallen=computeCascade(hitIdx);
  const full = fallen.size>=cans.length;
  const jackpot = fallen.size>=4;
  const golden = hitIdx===goldCanIdx();
  let gain = tokensPerCan()*fallen.size;
  if(jackpot) gain*=1.5;
  if(golden)  gain*=5;                              // «золотая банка» — твист места
  if(full && hasTwist('w5')) gain*=3;               // «джекпот-гирлянда» — твист места
  if(x2On()) gain*=2;
  earn(gain);
  S.throws++;
  if(jackpot) S.jackpots++;
  if(fallen.size>S.bestCascade){ S.bestCascade=fallen.size; submitScore(S.bestCascade); }
  fallen.forEach(i=>{ const c=cans.find(cc=>cc.idx===i);
    if(c && c.state==='up'){ c.state='falling'; c.fvx=(c.x<shelfCX?-1:1)*rr(50,110)+rr(-20,20);
      c.fvy=-rr(70,130); c.fvr=(rr(0,1)<0.5?-1:1)*rr(3,6); c.falpha=1; } });
  burstFx(ball.x, ball.y, (jackpot||golden)?'#FFC94A':'#6FCF97', '+'+fmt(gain)+(jackpot?' '+T('jackpot'):''));
  if(jackpot){ mascotCheer=1.1; for(let i=0;i<3;i++) burstFx(ball.x+rr(-20,20), ball.y+rr(-20,20), ['#FF6F4A','#B497D6','#6FCF97'][i], ''); }
  sfx("coin");
  ball=null;
  refreshHud(); persist();
}

// ---------- Частицы/всплывающие награды ----------
let particles=[], texts=[];
function burstFx(x,y,col,label){
  for(let i=0;i<10;i++){ const a=rr(0,6.28); particles.push({x,y,vx:Math.cos(a)*rr(30,80),vy:Math.sin(a)*rr(30,80)-20,life:0.6,g:1,col,r:rr(2,4)}); }
  if(label) texts.push({x,y:y-10,life:0.55,label});
}
function updateFx(dt){
  particles.forEach(p=>{ p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=140*dt*p.g; p.life-=dt; });
  particles=particles.filter(p=>p.life>0);
  texts.forEach(t=>{ t.y-=42*dt; t.life-=dt; });
  texts=texts.filter(t=>t.life>0);
}
function drawFx(){
  particles.forEach(p=>{ ctx.globalAlpha=Math.max(0,p.life/0.6); ctx.fillStyle=p.col;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,6.28); ctx.fill(); });
  ctx.globalAlpha=1;
  texts.forEach(t=>{ ctx.globalAlpha=Math.max(0,t.life/0.55); ctx.fillStyle=INK;
    ctx.font='900 15px Nunito, sans-serif'; ctx.textAlign='center'; ctx.fillText(t.label,t.x,t.y); });
  ctx.globalAlpha=1;
}

// ---------- Кадр ----------
let lastT=performance.now(), ferrisAngle=0, mascotBreath=0, mothPh=0, roundResetPending=false;
let hudAcc=0, tipAcc=0;
function frame(now){
  let dt=Math.max(0,Math.min(0.05,(now-lastT)/1000)); lastT=now;
  const t=now/1000;
  if(baseIps()>0) earn(ips()*dt);        // производство — earn, подарки — grant
  if(hasTwist('w1')){ autoAcc+=dt; while(autoAcc>=AUTO_EVERY){ autoAcc-=AUTO_EVERY; autoToss(); } }
  hudAcc+=dt; if(hudAcc>=0.5){ hudAcc=0; refreshHud(); persist(); }
  tipAcc+=dt; if(tipAcc>=1){ tipAcc=0; tipTick(); maybeInterstitial(); }
  ferrisAngle+=dt*0.18; mascotBreath+=dt; mothPh+=dt;
  if(mascotCheer>0) mascotCheer=Math.max(0,mascotCheer-dt);
  updateBalloon(dt);

  cans.forEach(c=>{
    if(c.state==='falling'){
      c.fvy+=G*dt; c.fx+=c.fvx*dt; c.fy+=c.fvy*dt; c.frot+=c.fvr*dt; c.falpha-=dt*0.7;
      if(c.falpha<=0) c.state='gone';
    }
  });
  if(!roundResetPending && cans.length && cans.every(c=>c.state==='gone')){
    roundResetPending=true;
    setTimeout(()=>{ initRound(); roundResetPending=false; refreshHud(); }, 500);
  }
  if(ball){
    ball.vy+=G*dt; ball.x+=ball.vx*dt; ball.y+=ball.vy*dt;
    ball.trail.push({x:ball.x,y:ball.y}); if(ball.trail.length>8) ball.trail.shift();
    let hitIdx=-1;
    for(const c of cans){ if(c.state!=='up') continue;
      const eff=canR*hitTolerance()+ball.r*0.6;
      if(Math.hypot(ball.x-c.x, ball.y-c.y)<eff){ hitIdx=c.idx; break; } }
    if(hitIdx>=0) resolveHit(hitIdx);
    else if(ball.x<-60 || ball.x>W+60 || ball.y>H+80){ ball=null; sfx("error"); }
  }
  updateFx(dt);

  ctx.clearRect(0,0,W,H);
  drawBackground();
  drawFerrisWheel(ferrisAngle);
  drawBulbs(t);
  if(balloon.active) drawBalloon();
  drawMoth(mothPh);
  drawMascot(mascotBreath, mascotCheer);
  drawCans();
  drawSling();
  drawTrajPreview();
  drawBall();
  drawFx();
  requestAnimationFrame(frame);
}

// ============================================================
//  Бот для прогона баланса (idle-economy-balance.md §10.3)
//  Гоняет ту же симуляцию, что и игра, без интерфейса, и возвращает
//  таблицу «время до вех» в минутах активной игры. Бот бьёт в нижний
//  центр пирамиды — это верхняя граница мастерства, а не средний игрок.
// ============================================================
function botThrow(){
  const up=cans.filter(c=>c.state==='up');
  if(!up.length){ initRound(); return; }
  // целимся в нижний ряд по центру: максимальный каскад
  let best=up[0];
  for(const c of up){ const p=pyramid()[c.idx];
    const bp=pyramid()[best.idx];
    if(p.row<bp.row || (p.row===bp.row && Math.abs(p.dx)<Math.abs(bp.dx))) best=c; }
  ball={x:best.x,y:best.y,vx:0,vy:20,r:8,trail:[]};
  resolveHit(best.idx);
  cans.forEach(c=>{ if(c.state==='falling') c.state='gone'; });
  if(cans.every(c=>c.state!=='up')) initRound();
}
function botOptions(){
  const base=Math.max(1e-6, baseIps()), o=[];
  if(S.upAim   <MAX_AIM)    o.push({k:'up',key:'upAim',   cost:aimCost(),   gain:0.05*base+1});
  if(S.upLights<MAX_LIGHTS) o.push({k:'up',key:'upLights',cost:lightsCost(),gain:0.25*base/passiveMult()});
  if(S.upHost  <MAX_HOST)   o.push({k:'up',key:'upHost',  cost:hostCost(),  gain:0.03*base+1});
  PRIZES.forEach((pz,pi)=>{ if(pi>=itemsUnlocked()) return;
    o.push({k:'pz',key:pz.id,cost:prizeCost(pz),gain:pz.ips*permMult()}); });
  return o.filter(x=>x.cost>0 && x.gain>0);
}
function botBuy(strategy){
  if(S.seeds>0) plantSeed();
  for(let guard=0; guard<12; guard++){
    let o=botOptions().filter(x=>x.cost<=S.coins);
    if(strategy==='stubborn') o=o.filter(x=>x.k==='pz');
    if(!o.length) return;
    const pick = (strategy==='greedy')
      ? o.reduce((a,b)=>b.cost<a.cost?b:a)
      : o.reduce((a,b)=> (b.cost/b.gain)<(a.cost/a.gain)?b:a);   // лучшая окупаемость
    if(pick.k==='up') buyUp(pick.key); else buyPrize(pick.key);
  }
}
window.__bal = function(strategy){
  strategy=strategy||'optimal';
  S=fresh(); platformLang='ru'; initRound();
  const rows=[]; let minutes=0, offlineH=0, lastLoop=0;
  const snap = label => rows.push({label, minutes, offlineH, ips:baseIps(),
    species:S.prizes.length, ups:S.upAim+S.upLights+S.upHost, seeds:S.seedsUsed});
  const tick = () => {
    catchUp=true; window.__silent=true;
    try{
      earn(baseIps());
      if(hasTwist('w1')){ autoAcc+=1; while(autoAcc>=AUTO_EVERY){ autoAcc-=AUTO_EVERY; autoToss(); } }
      botThrow();                    // активная игра: примерно один бросок в секунду
      botBuy(strategy);
    } finally { catchUp=false; window.__silent=false; }
    minutes += 1/60;
  };
  const session = mins => { for(let i=0;i<mins*60;i++){ tick();
    if(stopReady()){
      catchUp=true; window.__silent=true; try{
        S.seeds+=stopSeeds(stopIdx()); grant(Math.max(100,baseIps()*180));
        if(isFinalStop()){ S.loop++; S.route=0; initRound(); } else { S.route++; initRound(); }
      } finally { catchUp=false; window.__silent=false; }
      snap(S.loop>lastLoop ? ('ФИНАЛ (круг '+S.loop+')') : ('место '+(S.route+1)+' '+stop().id));
      lastLoop=S.loop;
      if(S.loop>=1) return true;
    } } return false; };
  const offline = hours => { offlineH+=hours; fastForward(hours*3600); };
  snap('старт');
  let stopped=false;
  for(let day=0; day<45 && !stopped; day++){
    if(day>0) offline(8);
    if(session(13)){ stopped=true; break; }
    offline(2); if(session(13)){ stopped=true; break; }
    offline(2); if(session(13)){ stopped=true; break; }
  }
  if(!stopped) snap('прогон оборван (не дошёл)');
  return rows;
};

  function sendReady(){
    if(readySent) return; readySent=true;
    try{ ysdk && ysdk.features && ysdk.features.LoadingAPI && ysdk.features.LoadingAPI.ready(); }catch(e){}
  }
  function go(raw){ sendReady(); boot(raw); }
  function start(){
    if(window.YaGames && !window.__noSDK){
      YaGames.init().then(sdk=>{
        ysdk=sdk;
        readPlatformLang();                      // язык платформы читаем ДО первой отрисовки
        try{ lb = sdk.leaderboards; }catch(e){}
        return sdk.getPlayer({scopes:false})
          .then(p=>{ player=p; return p.getData(["save"]); })
          .then(d=>go(d&&d.save?d.save:localRaw))
          .catch(()=>go(localRaw));
      }).catch(()=>go(localRaw));
      setTimeout(()=>go(localRaw),4000);
    } else go(localRaw);
  }
  if(window.__noSDK || window.YaGames) start();
  else window.__onSdkScriptDone = start;
})();
</script>
